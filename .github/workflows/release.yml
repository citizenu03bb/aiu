name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gnome-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: gnome-extension
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: The tag matches the version in aiu/__init__.py and metadata.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' ../aiu/__init__.py)
          name=$(python3 -c 'import json; print(json.load(open("metadata.json"))["version-name"])')
          echo "tag $TAG, aiu/__init__.py $version, metadata.json $name"
          [ "$TAG" = "v$version" ] && [ "$name" = "$version" ]
      - name: Install GJS
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gjs
      - name: Test the CLI (offline providers)
        working-directory: .
        run: uv run --python 3.12 --with pytest --with httpx --with rich pytest -q tests
      - name: Test and pack
        run: make test pack
      - name: Record the ZIP checksum
        run: sha256sum -- ./*.shell-extension.zip > release.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: gnome-extension-release
          path: |
            gnome-extension/*.shell-extension.zip
            gnome-extension/release.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish the ZIP and checksum on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          archives=(./*.shell-extension.zip)
          [ "${#archives[@]}" -eq 1 ] && [ -f "${archives[0]}" ]
          zip="${archives[0]}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$zip" release.sha256 --clobber
          else
            gh release create "$TAG" "$zip" release.sha256 --verify-tag \
              --notes-file ../.github/RELEASE_NOTES.md --generate-notes
          fi
