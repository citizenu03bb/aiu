# Lets pipx / uv tool install the `aiu` and `consult` commands:
#   pipx install git+https://github.com/citizenu03bb/aiu
# aiu.py keeps its inline script metadata, so `./aiu.py` still runs standalone
# with uv; keep the two dependency lists in sync.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aiu"
dynamic = ["version"]
description = "One local snapshot of every AI subscription/quota you pay for, with routing advice"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
]

# `aiu cookie import mistral --browser chrome|chromium|brave` decrypts the
# browser's cookies with AES; the standard library has none. Only that command
# imports it: pipx install 'aiu[cookies] @ git+…' or pipx inject aiu cryptography.
[project.optional-dependencies]
cookies = ["cryptography>=42"]

[project.urls]
Homepage = "https://github.com/citizenu03bb/aiu"

[project.scripts]
aiu = "aiu:main"
consult = "consult:main"

[tool.setuptools]
py-modules = ["aiu", "consult"]

[tool.setuptools.dynamic]
version = {attr = "aiu.__version__"}

# `uv run` installs the dev group, so the tests (CI included) can build and
# decrypt Chromium cookie fixtures.
[dependency-groups]
dev = ["cryptography>=42"]
